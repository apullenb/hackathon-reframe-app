name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The same gates that guard local work, so a red build never reaches the live site.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run validate:fixtures
      - run: npm run check:functional

      - run: npm run build
        env:
          # Project pages are served from /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
          # No Node process on a static host, so the app runs on prepared responses
          # unless a visitor supplies their own key.
          VITE_AI_MODE: auto

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

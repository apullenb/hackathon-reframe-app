<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Context Switch — Translate intent into impact.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- All three faces in one request. NOTE: for a variable font, every declared axis
         needs a value in EVERY tuple — an incomplete tuple makes Google return an HTML error
         page instead of CSS, which silently kills the whole stylesheet (all families, not just
         the malformed one). Verified: this URL returns 200 with real @font-face rules. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..900,0..100,0..1&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Context Switch translates intent into impact — across roles, relationships, and expectations."
    />
    <meta name="theme-color" content="#FAF7F2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
